<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة إدارة تاج | TAJ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Lalezar&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
/* ========== TOKENS ========== */
:root{--bg:#0a0405;--red:#C8102E;--red2:#8E0B20;--gold:#E6B84A;--tx:#F5ECE6;--mut:#a99a96;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:18px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--tx);font:500 15px/1.5 Cairo,Tahoma,sans-serif;background:radial-gradient(900px 520px at 85% -10%,rgba(200,16,46,.38),transparent),radial-gradient(700px 520px at -10% 110%,rgba(230,184,74,.16),transparent),var(--bg);background-attachment:fixed;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400}
/* ========== GLASS ========== */
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(200,16,46,.35)}
.btn.gold{background:linear-gradient(135deg,#F3CF73,var(--gold));color:#2A0A0A;box-shadow:0 6px 16px rgba(230,184,74,.3)}
.btn.ghost{background:var(--glass);border:1px solid var(--bd);box-shadow:none;font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.5);color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.07);font-size:16px}
.inp:focus{outline:2px solid var(--gold);outline-offset:1px}
select.inp option{color:#222}
label.f{display:block;margin:0 0 12px}.f>span{display:block;margin-bottom:5px;font-size:13px;color:var(--mut);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:900;background:rgba(255,255,255,.1)}
.chip.ok{background:rgba(52,211,153,.18);color:var(--ok)}.chip.warn{background:rgba(251,191,36,.18);color:var(--warn)}.chip.bad{background:rgba(248,113,113,.18);color:var(--bad)}.chip.gold{background:rgba(230,184,74,.2);color:var(--gold)}.chip.red{background:rgba(200,16,46,.3);color:#ffb3bd}
/* ========== LOGIN ========== */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .glass{width:100%;max-width:380px;padding:28px 22px;text-align:center}
.logo{font:400 64px/1 Lalezar;letter-spacing:2px}.logo b{color:var(--gold);font-weight:400}
.login p{color:var(--mut);margin:4px 0 20px}.login .f{text-align:right}.err{color:var(--bad);min-height:22px;margin:6px 0;font-weight:700}
/* ========== SHELL ========== */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(10,4,5,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{font:400 28px Lalezar}.brand b{color:var(--gold);font-weight:400}.brand small{font:700 12px Cairo;color:var(--mut);margin-right:8px}
.who{display:flex;gap:8px}
.nav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(14,6,8,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:0;border-radius:12px;background:none;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer}
.nav button i{font-style:normal;font-size:21px}
.nav button.on{color:var(--gold);background:rgba(230,184,74,.1)}
.nav .dot{position:absolute;top:2px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:900 11px/18px Cairo;text-align:center}
main{max-width:1000px;margin:0 auto;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}.head h2{font-size:30px}
@media(min-width:900px){body{padding-bottom:0;padding-right:200px}.nav{top:0;right:0;left:auto;bottom:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:6px;padding:90px 12px;border-top:0;border-left:1px solid var(--bd)}.nav button{flex:none;flex-direction:row;gap:10px;padding:12px;font-size:15px}.top{padding-right:216px}}
/* ========== DASHBOARD ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px}.stat i{font-style:normal;font-size:24px}.stat .n{font:400 30px/1.2 Lalezar;margin-top:2px}.stat .l{color:var(--mut);font-size:13px;font-weight:700}
.stat.hot{border-color:rgba(230,184,74,.6)}.stat.hot .n{color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{padding:16px}.card h3{font-size:22px;margin-bottom:10px}
.per{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.per div{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05)}.per b{display:block;font:400 20px Lalezar;color:var(--gold)}.per small{color:var(--mut);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.bars span{display:block;width:100%;min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--gold),var(--red))}
.top-l div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.top-l div:last-child{border:0}
/* ========== LISTS ========== */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools .inp{flex:1;min-width:140px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px}
.thumb{flex:none;width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.07) center/cover no-repeat;display:grid;place-items:center;font-size:26px}
.item .mid{flex:1;min-width:0}.item .nm{font-weight:900;font-size:16px}.item .sub{color:var(--mut);font-size:13px}.item .pr{font:400 18px Lalezar;color:var(--gold)}.item .pr s{font:500 12px Cairo;color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);font-size:12px;font-weight:700;cursor:pointer}.tg.on{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:var(--ok)}.tg.off{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.45);color:var(--bad)}
@media(max-width:640px){.item{flex-wrap:wrap}.acts{width:100%;justify-content:flex-start}}
.empty{padding:34px 10px;text-align:center;color:var(--mut)}
/* ========== ORDERS ========== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}.tabs button{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);font-weight:700;cursor:pointer}.tabs button.on{background:var(--red);border-color:var(--red)}
.ord{padding:14px}.ord .oh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.ord .no{font:400 24px Lalezar;color:var(--gold)}
.ord .ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:14px}.ord .tot{display:flex;justify-content:space-between;margin:8px 0;font-weight:900}.ord .tot b{font:400 22px Lalezar;color:var(--gold)}
.ord a{color:var(--gold)}
.ord textarea{min-height:44px;resize:vertical}
.ord .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ========== MODAL ========== */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal .sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));background:#16090b;border:1px solid var(--bd);border-radius:22px 22px 0 0}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:22px}}
.sheet h3{font-size:26px;margin-bottom:12px}.sheet .bt{display:flex;gap:8px;margin-top:14px}.sheet .bt .btn{flex:1}
.up{display:flex;gap:10px;align-items:center;margin-bottom:12px}.up .thumb{width:84px;height:84px}
.sw{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 8px}.sw label{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer}.sw input{width:20px;height:20px;accent-color:var(--gold)}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;padding:10px 18px;border-radius:99px;background:#1f1214;border:1px solid var(--bd);font-weight:700;opacity:0;pointer-events:none}.toast.show{opacity:1}.toast.bad{border-color:var(--bad);color:var(--bad)}.toast.ok{border-color:var(--ok);color:var(--ok)}
.spin{padding:40px;text-align:center;color:var(--mut)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <form class="glass" id="loginForm" autocomplete="on">
    <div class="logo">T<b>A</b>J</div>
    <p>لوحة إدارة مطعم تاج</p>
    <label class="f"><span>البريد الإلكتروني</span><input class="inp" id="em" type="email" autocomplete="username" required></label>
    <label class="f"><span>كلمة المرور</span><input class="inp" id="pw" type="password" autocomplete="current-password" required></label>
    <div class="err" id="loginErr"></div>
    <button class="btn gold" style="width:100%" id="loginBtn">تسجيل الدخول</button>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="brand">T<b>A</b>J<small>لوحة الإدارة</small></div>
    <div class="who"><button class="btn ghost sm" id="btnPw">🔑 كلمة المرور</button><button class="btn ghost sm" id="btnOut">خروج</button></div>
  </header>
  <nav class="nav" id="nav">
    <button data-v="dash" class="on"><i>📊</i>الرئيسية</button>
    <button data-v="menu"><i>🍔</i>المنيو</button>
    <button data-v="cats"><i>🗂️</i>التصنيفات</button>
    <button data-v="ads"><i>📣</i>العروض</button>
    <button data-v="orders"><i>🧾</i>الطلبات<span class="dot" id="newDot" hidden></span></button>
  </nav>
  <main id="view"></main>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TAJ ADMIN — all data lives in Supabase; access is enforced by
   Row Level Security (only users listed in public.admins).
   The key below is the PUBLIC (anon) key and is safe in the browser.
   ============================================================ */
const SB_URL='https://ppdzgsdfrptsoeuwszcu.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZHpnc2RmcnB0c29ldXdzemN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MjEzNzEsImV4cCI6MjExMTA5NzM3MX0.MgeOyHgxauzD_pwl03uTNU2Qa1SEcUtWZeMmyamY5RQ';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const dt=s=>new Date(s).toLocaleString('ar-IQ-u-nu-latn',{timeZone:'Asia/Baghdad',dateStyle:'medium',timeStyle:'short'});
const STATUS={new:['جديد','red'],accepted:['مقبول','gold'],preparing:['قيد التحضير','warn'],ready:['جاهز','ok'],completed:['مكتمل','ok'],cancelled:['ملغي','bad']};
const FLOW=['new','accepted','preparing','ready','completed'];
const S={cats:[],prods:[],anns:[],orders:[],stats:null,view:'dash',ostat:'all',q:'',cf:''};

/* ---------- helpers ---------- */
let tt;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='toast show '+(k||'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2600)}
function errMsg(e){const m=(e&&e.message)||String(e);
 if(e&&e.code==='23503'||/foreign key|violates foreign/i.test(m))return 'لا يمكن الحذف لأنه مرتبط ببيانات أخرى (انقل الأطباق أو احذفها أولاً).';
 if(/row-level security|permission denied|JWT/i.test(m))return 'ليس لديك صلاحية، سجّل الدخول من جديد.';
 if(/check constraint|violates check/i.test(m))return 'قيمة غير صالحة، راجع الحقول.';
 if(/Failed to fetch|NetworkError/i.test(m))return 'تعذر الاتصال بالإنترنت.';
 return m}
async function run(p,okMsg){try{const r=await p;if(r&&r.error)throw r.error;if(okMsg)toast(okMsg,'ok');return r}catch(e){toast(errMsg(e),'bad');throw e}}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden'}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function ask(msg,okTxt){return new Promise(res=>{openModal(`<h3>تأكيد</h3><p style="margin-bottom:6px">${esc(msg)}</p><div class="bt"><button class="btn danger" id="yes">${esc(okTxt||'نعم، تأكيد')}</button><button class="btn ghost" id="no">إلغاء</button></div>`);$('#yes').onclick=()=>{closeModal();res(true)};$('#no').onclick=()=>{closeModal();res(false)}})}

/* ---------- images: resize in browser, upload to Storage ---------- */
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('تعذر قراءة الصورة'));i.src=u})}
async function uploadImage(file,folder){
 if(!/^image\//.test(file.type))throw new Error('اختر ملف صورة');
 const img=await loadImg(file),M=900,k=Math.min(1,M/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
 const path=folder+'/'+crypto.randomUUID()+'.jpg';
 const {error}=await sb.storage.from('taj-media').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('taj-media').getPublicUrl(path).data.publicUrl;
}
function imgField(url){return `<div class="up"><div class="thumb" id="pv" style="${url?`background-image:url('${esc(url)}')`:''}">${url?'':'🖼️'}</div><div><input type="file" id="file" accept="image/*" hidden><button type="button" class="btn ghost sm" id="pick">📷 رفع صورة</button> <button type="button" class="btn danger sm" id="rmimg" ${url?'':'hidden'}>حذف الصورة</button><div class="sub" id="upst" style="color:var(--mut);font-size:12px;margin-top:4px"></div></div></div><input type="hidden" id="imgurl" value="${esc(url||'')}">`}
function wireImg(folder){
 $('#pick').onclick=()=>$('#file').click();
 $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#upst').textContent='جاري الرفع...';
  try{const u=await uploadImage(f,folder);$('#imgurl').value=u;$('#pv').style.backgroundImage=`url('${u}')`;$('#pv').textContent='';$('#rmimg').hidden=false;$('#upst').textContent='تم رفع الصورة ✓'}
  catch(err){$('#upst').textContent='';toast(errMsg(err),'bad')}};
 $('#rmimg').onclick=()=>{$('#imgurl').value='';$('#pv').style.backgroundImage='';$('#pv').textContent='🖼️';$('#rmimg').hidden=true};
}

/* ---------- data ---------- */
async function loadCats(){S.cats=(await run(sb.from('categories').select('*').order('sort_order').order('created_at'))).data}
async function loadProds(){S.prods=(await run(sb.from('products').select('*').order('sort_order').order('created_at'))).data}
async function loadAnns(){S.anns=(await run(sb.from('announcements').select('*').order('sort_order').order('created_at',{ascending:false}))).data}
async function loadOrders(){S.orders=(await run(sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(300))).data;newDot()}
async function loadStats(){S.stats=(await run(sb.rpc('admin_stats'))).data}
function newDot(){const n=S.orders.filter(o=>o.status==='new').length,d=$('#newDot');d.hidden=!n;d.textContent=n}
const cat=id=>S.cats.find(c=>c.id===id);

/* ---------- navigation ---------- */
const VIEWS={dash:vDash,menu:vMenu,cats:vCats,ads:vAds,orders:vOrders};
async function go(v){S.view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#view').innerHTML='<div class="spin">جاري التحميل...</div>';
 try{await VIEWS[v]()}catch(e){$('#view').innerHTML=`<div class="empty">تعذر التحميل: ${esc(errMsg(e))}</div>`}window.scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

/* ============ DASHBOARD ============ */
async function vDash(){
 await Promise.all([loadStats(),loadOrders()]);const s=S.stats,p=s.periods,mx=Math.max(1,...s.last7.map(d=>d.sales));
 const dn=d=>new Date(d+'T00:00:00').toLocaleDateString('ar-IQ-u-nu-latn',{weekday:'short'});
 $('#view').innerHTML=`<div class="head"><h2>الرئيسية</h2><button class="btn ghost sm" onclick="go('dash')">🔄 تحديث</button></div>
 <div class="stats">
  <div class="glass stat hot"><i>🔔</i><div class="n">${fmt(s.new_orders)}</div><div class="l">طلبات جديدة</div></div>
  <div class="glass stat"><i>🧾</i><div class="n">${fmt(s.orders)}</div><div class="l">كل الطلبات</div></div>
  <div class="glass stat"><i>💰</i><div class="n">${fmt(s.sales_total)}</div><div class="l">إجمالي المبيعات (د.ع)</div></div>
  <div class="glass stat"><i>🍔</i><div class="n">${fmt(s.products)}</div><div class="l">المنتجات</div></div>
  <div class="glass stat"><i>🗂️</i><div class="n">${fmt(s.categories)}</div><div class="l">التصنيفات</div></div>
 </div>
 <div class="grid2">
  <div class="glass card"><h3>المبيعات</h3><div class="per">
   <div><small>اليوم</small><b>${fmt(p.today.sales)}</b><small>${fmt(p.today.orders)} طلب</small></div>
   <div><small>آخر 7 أيام</small><b>${fmt(p.week.sales)}</b><small>${fmt(p.week.orders)} طلب</small></div>
   <div><small>هذا الشهر</small><b>${fmt(p.month.sales)}</b><small>${fmt(p.month.orders)} طلب</small></div></div>
   <div class="bars">${s.last7.map(d=>`<div title="${fmt(d.sales)}"><span style="height:${Math.round(d.sales/mx*100)}%"></span>${dn(d.day)}</div>`).join('')}</div></div>
  <div class="glass card"><h3>أكثر الأطباق طلباً</h3><div class="top-l">${s.top.length?s.top.map((t,i)=>`<div><span>${i+1}. ${esc(t.name)}</span><b>${fmt(t.qty)} <small style="color:var(--mut)">قطعة</small></b></div>`).join(''):'<div class="empty">لا توجد طلبات بعد</div>'}</div></div>
 </div>`;
}

/* ============ MENU ============ */
async function vMenu(){await Promise.all([loadCats(),loadProds()]);drawMenu()}
function drawMenu(){
 const q=S.q.trim(),L=S.prods.filter(p=>(!S.cf||p.category_id===S.cf)&&(!q||p.name.includes(q)||(p.description||'').includes(q)));

async function moveCat(id,d){const i=S.cats.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=S.cats.length)return;
 const a=S.cats[i],b=S.cats[j],arr=[...S.cats];arr.splice(i,1);arr.splice(j,0,a);
 await run(Promise.all(arr.map((c,k)=>sb.from('categories').update({sort_order:k+1}).eq('id',c.id))));await loadCats();drawCats()}

/* ============ ANNOUNCEMENTS / OFFERS ============ */
async function vAds(){await loadAnns();drawAds()}
function annState(a){const n=Date.now();if(!a.is_active)return['متوقف','bad'];if(a.ends_at&&new Date(a.ends_at)<=n)return['منتهي','bad'];if(a.starts_at&&new Date(a.starts_at)>n)return['مجدول','warn'];return['يظهر الآن','ok']}
function drawAds(){
 $('#view').innerHTML=`<div class="head"><h2>الإشعارات والعروض</h2><button class="btn" data-a="adda">+ إعلان / عرض</button></div><div class="list">${S.anns.map((a,i)=>{const st=annState(a);return `<div class="glass item" data-id="${a.id}">
 <div class="thumb" style="${a.image_url?`background-image:url('${esc(a.image_url)}')`:''}">${a.image_url?'':(a.kind==='offer'?'🏷️':'📣')}</div>
 <div class="mid"><div class="nm">${esc(a.title)} <span class="chip ${st[1]}">${st[0]}</span> ${a.discount_text?`<span class="chip gold">${esc(a.discount_text)}</span>`:''}</div>
 <div class="sub">${a.kind==='offer'?'عرض':'إعلان'}${a.starts_at?' · من '+dt(a.starts_at):''}${a.ends_at?' · إلى '+dt(a.ends_at):''}</div></div>
 <div class="acts"><button class="tg ${a.is_active?'on':'off'}" data-a="tann">${a.is_active?'مفعّل':'متوقف'}</button>
 <button class="btn ghost sm" data-a="aup" ${i?'':'disabled'}>▲</button><button class="btn ghost sm" data-a="adn" ${i<S.anns.length-1?'':'disabled'}>▼</button>
 <button class="btn ghost sm" data-a="edita">✏️</button><button class="btn danger sm" data-a="dela">🗑️</button></div></div>`}).join('')||'<div class="empty">لا توجد إعلانات</div>'}</div>`}
const toLocal=s=>{if(!s)return'';const d=new Date(s),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
function annForm(a){a=a||{kind:'offer',is_active:true,sort_order:0};
 openModal(`<h3>${a.id?'تعديل':'إضافة'} إعلان / عرض</h3><form id="af">${imgField(a.image_url)}
 <div class="row2"><label class="f"><span>النوع</span><select class="inp" name="kind"><option value="offer" ${a.kind==='offer'?'selected':''}>عرض / خصم</option><option value="ad" ${a.kind==='ad'?'selected':''}>إعلان</option></select></label>
 <label class="f"><span>نص الخصم (مثال: خصم 20%)</span><input class="inp" name="discount_text" maxlength="40" value="${esc(a.discount_text)}"></label></div>
 <label class="f"><span>العنوان *</span><input class="inp" name="title" required maxlength="120" value="${esc(a.title)}"></label>
 <label class="f"><span>التفاصيل</span><textarea class="inp" name="body" rows="3" maxlength="600">${esc(a.body)}</textarea></label>
 <div class="row2"><label class="f"><span>بداية العرض</span><input class="inp" type="datetime-local" name="starts_at" value="${toLocal(a.starts_at)}"></label>
 <label class="f"><span>نهاية العرض</span><input class="inp" type="datetime-local" name="ends_at" value="${toLocal(a.ends_at)}"></label></div>
 <div class="sw"><label><input type="checkbox" name="is_active" ${a.is_active?'checked':''}>مفعّل (يظهر للزبائن)</label></div>
 <div class="bt"><button class="btn gold">💾 حفظ</button><button type="button" class="btn ghost" id="cn">إلغاء</button></div></form>`);
 wireImg('announcements');$('#cn').onclick=closeModal;
 $('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),d=k=>f.get(k)?new Date(f.get(k)).toISOString():null;
  const row={kind:f.get('kind'),title:f.get('title').trim(),body:f.get('body').trim()||null,discount_text:f.get('discount_text').trim()||null,image_url:$('#imgurl').value||null,starts_at:d('starts_at'),ends_at:d('ends_at'),is_active:f.get('is_active')==='on'};
  if(!row.title)return toast('اكتب العنوان','bad');
  if(row.starts_at&&row.ends_at&&row.ends_at<=row.starts_at)return toast('نهاية العرض يجب أن تكون بعد البداية','bad');
  if(!a.id)row.sort_order=(Math.max(0,...S.anns.map(x=>x.sort_order))+1);
  try{await run(a.id?sb.from('announcements').update(row).eq('id',a.id):sb.from('announcements').insert(row),'تم الحفظ ✓');closeModal();await loadAnns();drawAds()}catch(_){}};
}
async function moveAnn(id,d){const i=S.anns.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=S.anns.length)return;
 const arr=[...S.anns],[a]=arr.splice(i,1);arr.splice(j,0,a);
 await run(Promise.all(arr.map((c,k)=>sb.from('announcements').update({sort_order:k+1}).eq('id',c.id))));await loadAnns();drawAds()}

/* ============ ORDERS ============ */
async function vOrders(){await loadOrders();drawOrders()}
function drawOrders(){
 const cnt=s=>s==='all'?S.orders.length:S.orders.filter(o=>o.status===s).length,L=S.orders.filter(o=>S.ostat==='all'||o.status===S.ostat);
 $('#view').innerHTML=`<div class="head"><h2>الطلبات</h2><button class="btn ghost sm" onclick="go('orders')">🔄 تحديث</button></div>
 <div class="tabs"><button data-os="all" class="${S.ostat==='all'?'on':''}">الكل (${cnt('all')})</button>${Object.keys(STATUS).map(k=>`<button data-os="${k}" class="${S.ostat===k?'on':''}">${STATUS[k][0]} (${cnt(k)})</button>`).join('')}</div>
 <div class="list">${L.map(o=>{const st=STATUS[o.status],ix=FLOW.indexOf(o.status),nx=ix>=0&&ix<FLOW.length-1?FLOW[ix+1]:null;return `<div class="glass ord" data-id="${o.id}">
 <div class="oh"><span class="no">#${o.id}</span><span class="chip ${st[1]}">${st[0]}</span><span class="sub" style="color:var(--mut);font-size:13px">${dt(o.created_at)}</span></div>
 <div style="margin:6px 0">${o.customer_name?'👤 '+esc(o.customer_name):'👤 بدون اسم'}${o.phone?` · <a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a>`:''}${o.address?`<div>📍 ${esc(o.address)}</div>`:''}${o.notes?`<div>📝 ${esc(o.notes)}</div>`:''}</div>
 ${(o.order_items||[]).map(i=>`<div class="ln"><span>${i.qty} × ${esc(i.name)}${i.size?` (${esc(i.size)})`:''}</span><span>${fmt(i.qty*i.unit_price)}</span></div>`).join('')}
 <div class="tot"><span>المجموع (${o.items_count} قطعة)</span><b>${fmt(o.total)} د.ع</b></div>
 <textarea class="inp" data-an placeholder="ملاحظات إدارية...">${esc(o.admin_notes)}</textarea>
 <div class="bt">${nx?`<button class="btn" data-a="next">➜ ${STATUS[nx][0]}</button>`:''}<select class="inp" data-st style="width:auto">${Object.keys(STATUS).map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${STATUS[k][0]}</option>`).join('')}</select><button class="btn ghost sm" data-a="saveo">💾 حفظ</button><button class="btn danger sm" data-a="delo">🗑️</button></div></div>`}).join('')||'<div class="empty">لا توجد طلبات</div>'}</div>`}
async function updOrder(id,patch,msg){await run(sb.from('orders').update(patch).eq('id',id),msg);await loadOrders();drawOrders()}

/* ============ ACTIONS (event delegation) ============ */
document.addEventListener('click',async e=>{
 const os=e.target.closest('[data-os]');if(os){S.ostat=os.dataset.os;drawOrders();return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,box=b.closest('[data-id]'),id=box&&box.dataset.id;
 try{
 if(a==='addp')prodForm(null,'food');
 else if(a==='addd')prodForm(null,'drink');
 else if(a==='editp')prodForm(S.prods.find(p=>p.id===id));
 else if(a==='tav'){const p=S.prods.find(x=>x.id===id);await run(sb.from('products').update({is_available:!p.is_available}).eq('id',id),p.is_available?'تم إيقاف التوفر':'تم تفعيل التوفر');await loadProds();drawMenu()}
 else if(a==='thid'){const p=S.prods.find(x=>x.id===id);await run(sb.from('products').update({is_hidden:!p.is_hidden}).eq('id',id),p.is_hidden?'ظهر الطبق في المنيو':'تم إخفاء الطبق');await loadProds();drawMenu()}
 else if(a==='delp'){const p=S.prods.find(x=>x.id===id);if(await ask('حذف «'+p.name+'» نهائياً من المنيو؟'))
  {await run(sb.from('products').delete().eq('id',id),'تم الحذف');await loadProds();drawMenu()}}
 else if(a==='addc')catForm();
 else if(a==='editc')catForm(S.cats.find(c=>c.id===id));
 else if(a==='tcat'){const c=S.cats.find(x=>x.id===id);await run(sb.from('categories').update({is_active:!c.is_active}).eq('id',id));await loadCats();drawCats()}
 else if(a==='cup')await moveCat(id,-1);else if(a==='cdn')await moveCat(id,1);
 else if(a==='delc'){const c=S.cats.find(x=>x.id===id),n=S.prods.filter(p=>p.category_id===id).length;
  if(n)return toast('هذا التصنيف فيه '+n+' صنف. انقلها أو احذفها أولاً.','bad');
  if(await ask('حذف تصنيف «'+c.name_ar+'»؟')){await run(sb.from('categories').delete().eq('id',id),'تم الحذف');await loadCats();drawCats()}}
 else if(a==='adda')annForm();
 else if(a==='edita')annForm(S.anns.find(x=>x.id===id));
 else if(a==='tann'){const x=S.anns.find(y=>y.id===id);await run(sb.from('announcements').update({is_active:!x.is_active}).eq('id',id));await loadAnns();drawAds()}
 else if(a==='aup')await moveAnn(id,-1);else if(a==='adn')await moveAnn(id,1);
 else if(a==='dela'){const x=S.anns.find(y=>y.id===id);if(await ask('حذف «'+x.title+'»؟')){await run(sb.from('announcements').delete().eq('id',id),'تم الحذف');await loadAnns();drawAds()}}
 else if(a==='next'){const o=S.orders.find(x=>String(x.id)===id),nx=FLOW[FLOW.indexOf(o.status)+1];await updOrder(o.id,{status:nx,admin_notes:box.querySelector('[data-an]').value.trim()||null},'تم تحديث الطلب #'+o.id)}
 else if(a==='saveo'){const o=S.orders.find(x=>String(x.id)===id);await updOrder(o.id,{status:box.querySelector('[data-st]').value,admin_notes:box.querySelector('[data-an]').value.trim()||null},'تم الحفظ ✓')}
 else if(a==='delo'){if(await ask('حذف الطلب #'+id+' نهائياً؟')){await run(sb.from('orders').delete().eq('id',id),'تم الحذف');await loadOrders();drawOrders()}}
 }catch(_){}
});

/* ============ AUTH ============ */
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return showLogin();
 const {data}=await sb.from('admins').select('user_id').maybeSingle();
 if(!data){await sb.auth.signOut();return showLogin('هذا الحساب ليس مديراً.')}
 $('#login').hidden=true;$('#app').hidden=false;await Promise.all([loadCats(),loadOrders().catch(()=>{})]);go(S.view);
}
function showLogin(m){$('#app').hidden=true;$('#login').hidden=false;$('#loginErr').textContent=m||''}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').textContent='';const b=$('#loginBtn');b.disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});b.disabled=false;
 if(error){$('#loginErr').textContent=/Invalid login/i.test(error.message)?'البريد أو كلمة المرور غير صحيحة':errMsg(error);return}
 $('#pw').value='';boot()};
$('#btnOut').onclick=async()=>{await sb.auth.signOut();showLogin()};
$('#btnPw').onclick=()=>{openModal(`<h3>تغيير كلمة المرور</h3><form id="pwf"><label class="f"><span>كلمة المرور الجديدة (8 أحرف على الأقل)</span><input class="inp" type="password" id="np" minlength="8" autocomplete="new-password" required></label>
 <label class="f"><span>أعد كتابتها</span><input class="inp" type="password" id="np2" autocomplete="new-password" required></label>
 <div class="bt"><button class="btn gold">حفظ</button><button type="button" class="btn ghost" id="cn">إلغاء</button></div></form>`);$('#cn').onclick=closeModal;
 $('#pwf').onsubmit=async e=>{e.preventDefault();if($('#np').value.length<8)return toast('8 أحرف على الأقل','bad');if($('#np').value!==$('#np2').value)return toast('كلمتا المرور غير متطابقتين','bad');
  try{await run(sb.auth.updateUser({password:$('#np').value}),'تم تغيير كلمة المرور ✓');closeModal()}catch(_){}}};
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin()});
setInterval(async()=>{if(document.hidden||$('#app').hidden)return;try{await loadOrders();if(S.view==='orders'&&$('#modal').hidden&&!document.activeElement.matches('textarea,input,select'))drawOrders()}catch(_){}},25000);
boot();
</script>
</body>
</html>
